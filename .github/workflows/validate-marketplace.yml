name: Validate NEXORA marketplace

on:
  push:
    branches: [main]
    paths:
      - "marketplace.html"
      - "index.html"
      - "shoppage.html"
      - "seller-portal.html"
      - "storefront-demo.html"
      - "seller-portal-i18n.js"
      - "scripts/check-marketplace.mjs"
      - "tests/**"
      - "supabase/migrations/**"
      - ".github/workflows/validate-marketplace.yml"
  pull_request:
    paths:
      - "marketplace.html"
      - "index.html"
      - "shoppage.html"
      - "seller-portal.html"
      - "storefront-demo.html"
      - "seller-portal-i18n.js"
      - "scripts/check-marketplace.mjs"
      - "tests/**"
      - "supabase/migrations/**"
      - ".github/workflows/validate-marketplace.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    # Pin the runner to Ubuntu 24.04 because the pinned Playwright version
    # does not yet provide browser dependencies for the ubuntu-latest image.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source, localization and database guardrails
        run: node scripts/check-marketplace.mjs
      - name: Install Playwright browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nexora-http.log 2>&1 &
      - name: Run mobile browser smoke tests
        run: node tests/browser-smoke.mjs
